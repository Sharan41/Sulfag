<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sulfag Hero - Cargill Style Demo</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
     
    }

    :root {
      /* Sulfag Brand Colors */
      --sulfag-green: #00703C;
      --sulfag-light-green: #8DC63F;
      --sulfag-dark: #1A1A1A;
      --sulfag-cream: #F5F5F0;
      
      /* Typography */
      --font-heading: 'Playfair Display', Georgia, serif;
      --font-body: 'Source Sans 3', 'Proxima Nova', sans-serif;
    }

    /* ====================== */
    /* HERO SECTION           */
    /* ====================== */
    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      min-height: 700px;
      overflow: hidden;
      background-color: #e7e5d7;
    }

    /* Background Image */
    .hero-background {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 70%;
      z-index: 1;
    }

    .hero-background img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Floating Navbar (Cargill style) */
    .navbar {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 40px);
      max-width: 1400px;
      background: white;
      border-radius: 50px;
      padding: 15px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }

    .logo {
      font-family: var(--font-heading);
      font-size: 1.8rem;
      font-weight: 700;
      color: #48501e;
    }

    .nav-links {
      display: flex;
      gap: 35px;
      list-style: none;
    }

    .nav-links a {
      font-family: var(--font-body);
      font-size: 0.95rem;
      font-weight: 500;
      color: #48501e;
      text-decoration: none;
      transition: color 0.3s;
    }

    .nav-links a:hover {
      color: var(--sulfag-green);
    }

    /* ====================== */
    /* CURVED SVG OVERLAY     */
    /* ====================== */
    .hero-shape {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;     /* Full width to extend to right edge */
      height: 90%;     /* Slightly taller for better coverage */
      z-index: 2;
      pointer-events: none;
    }

    .hero-shape svg {
      width: 100%;
      height: 100%;
    }

    /* ====================== */
    /* HERO CONTENT           */
    /* ====================== */
    .hero-content {
      position: absolute;
      bottom: 25%;
      left: 11%;
      max-width: 550px;
      z-index: 3;
      color: #e7e5d7;
    }

    .hero-content h1 {
      font-family: var(--font-heading);
      font-size: clamp(2.5rem, 5vw, 4rem);
      font-weight: 400;
      line-height: 1.2;
      margin-bottom: 25px;
     
    }

    .hero-content h1 em {
      font-style: italic;
     
    }

    .hero-content p {
      font-family: var(--font-body);
      font-size: 1.1rem;
      font-weight: 300;
      line-height: 1.7;
      margin-bottom: 30px;
      opacity: 0.95;
    }

    .hero-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-body);
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--sulfag-green);
      background: white;
      padding: 14px 28px;
      border-radius: 30px;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .hero-btn:hover {
      background: var(--sulfag-light-green);
      color: white;
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.15);
    }

    .hero-btn svg {
      width: 16px;
      height: 16px;
    }

    /* ====================== */
    /* RESPONSIVE             */
    /* ====================== */
    @media (max-width: 1024px) {
      .hero-content {
        bottom: 22%;
        left: 5%;
        right: 10%;
        max-width: none;
       
      }
      .hero-content{
        max-width: 450px;
      }
      
      .hero-shape {
      position: absolute;
     
      bottom: 0;
      left: 0;
      width: 100%;     /* Full width to extend to right edge */
      height: 80%;     /* Slightly taller for better coverage */
      z-index: 2;
      pointer-events: none;
    }

    }

    @media (max-width: 768px) {
      .navbar {
        padding: 12px 25px;
      }
      
      .nav-links {
        display: none; /* Mobile menu needed */
      }
      
      .hero-content h1 {
        font-size: 2rem;
      }
      
      .hero-content {
        bottom: 28%;
      }
    }
  </style>
</head>
<body>

    </div>

    <!-- Hero Content -->
    <div class="hero-content">
      <h1>Protecting Crops,<br><em>Nurturing Growth</em></h1>
      <p>For 39 years, Sulfag Products Limited has been at the forefront of agrochemical innovation, helping farmers protect their harvests and feed the nation.</p>
      <a href="#" class="hero-btn">
        <svg viewBox="0 0 24 24" fill="currentColor">

  </section>
